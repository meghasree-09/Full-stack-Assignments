<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shopping Cart</title>
    <link rel="stylesheet" href="smartshoppingcart.css">
</head>
<body>

    <header>
        <h1>Smart Shopping Cart</h1>
    </header>

    <!-- Search and Filter -->
    <section>
        <input
            type="text"
            id="search"
            placeholder="Search Product..."
        >

        <select id="category">
            <option value="All">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Stationery">Stationery</option>
            <option value="Accessories">Accessories</option>
        </select>
    </section>

    <!-- Product Catalog -->
    <main>
        <h2>Products</h2>

        <div id="products"></div>
    </main>

    <hr>

    <!-- Shopping Cart -->
    <section>

        <h2>Shopping Cart</h2>

        <table border="1" cellpadding="8">

            <thead>

                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="cartItems">

            </tbody>

        </table>

        <h3>Total Items :
            <span id="totalItems">0</span>
        </h3>

        <h3>Total Price :
            ₹<span id="totalPrice">0</span>
        </h3>

    </section>

    <hr>

    <!-- Checkout -->
    <section>

        <h2>Checkout</h2>

        <input
            type="text"
            id="customerName"
            placeholder="Enter Customer Name"
        >

        <br><br>

        <input
            type="text"
            id="coupon"
            placeholder="Enter Coupon Code"
        >

        <button onclick="applyCoupon()">
            Apply Coupon
        </button>

        <p id="couponMessage"></p>

        <button onclick="checkout()">
            Checkout
        </button>

    </section>

    <hr>

    <!-- Invoice -->

    <section>

        <div id="invoice"></div>

    </section>

    <script src="smartshoppingcart.js"></script>

</body>
</html>
